name: Client Next.js CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-and-test:
    name: Lint, Test, & Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality (Lint)
        run: npm run lint

      - name: Security Check (Dependency Audit)
        run: npm audit --audit-level=high || true

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Archive Production Artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: client-build-artifacts
          path: .next
          retention-days: 7

  deploy:
    name: Deploy Client
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Staging (Render)
        if: github.ref == 'refs/heads/develop'
        run: |
          curl -fX POST "${{ secrets.RENDER_CLIENT_STAGING_DEPLOY_HOOK }}"

      - name: Deploy to Production (Render)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fX POST "${{ secrets.RENDER_CLIENT_PRODUCTION_DEPLOY_HOOK }}"
